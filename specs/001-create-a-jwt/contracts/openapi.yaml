openapi: 3.1.0
info:
  title: Maliev Authentication Service API
  description: |
    JWT token-based authentication service supporting multi-user type authentication (customer and employee)
    with OAuth 2.0 RFC 9700 compliant refresh token rotation and comprehensive security features.

    ## Features
    - Access token generation (15 min expiry, EdDSA/ES256 signing)
    - Refresh token rotation with reuse detection
    - Token validation with full user identity
    - Distributed token revocation (<2s propagation)
    - Dual-factor rate limiting (account + IP based)
    - Circuit breaker for external validation services
    - OpenTelemetry distributed tracing

    ## Security
    - OAuth 2.0 RFC 9700 compliant
    - SHA-256 refresh token hashing
    - Constant-time comparison
    - Progressive authentication delays
    - Service-to-service authentication support

  version: 1.0.0
  contact:
    name: Maliev Engineering Team
    url: https://maliev.com
  license:
    name: Proprietary

servers:
  - url: https://auth.maliev.com
    description: Production
  - url: https://auth-staging.maliev.com
    description: Staging
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Authentication
    description: User authentication and token management
  - name: Validation
    description: Token validation and user identity retrieval
  - name: Revocation
    description: Token revocation operations
  - name: Health
    description: Service health and readiness checks

paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate user and generate tokens
      description: |
        Validates user credentials against external validation service (customer or employee)
        and generates access + refresh token pair on success.

        **Rate Limiting**:
        - Account-based: 5 attempts per 15 minutes
        - IP-based: 20 attempts per 15 minutes across all accounts
        - Progressive delays: 1s (3rd attempt), 2s (4th), 4s (5th)

        **Circuit Breaker**:
        - Returns 503 if external validation service circuit is open

      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              customer:
                summary: Customer login
                value:
                  username: "customer@example.com"
                  password: "SecurePassword123!"
                  user_type: "customer"
              employee:
                summary: Employee login
                value:
                  username: "employee@maliev.com"
                  password: "EmployeePass456!"
                  user_type: "employee"

      responses:
        '200':
          description: Authentication successful
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                success:
                  summary: Successful authentication
                  value:
                    access_token: "eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9..."
                    refresh_token: "RToyMzQ1Njc4OTBhYmNkZWY="
                    token_type: "Bearer"
                    expires_in: 900

        '401':
          description: Invalid credentials
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_credentials:
                  summary: Invalid username or password
                  value:
                    error: "invalid_credentials"
                    error_description: "The provided credentials are invalid"
                    correlation_id: "4bf92f35-77b3-4da6-a3ce-929d0e0e4736"

        '429':
          description: Rate limit exceeded
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              description: Always "0" when rate limited
              schema:
                type: integer
                example: 0
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                account_limit:
                  summary: Account rate limit exceeded
                  value:
                    error: "too_many_requests"
                    error_description: "Too many failed login attempts. Account locked for 15 minutes."
                    retry_after: 900
                    correlation_id: "abc123..."
                ip_limit:
                  summary: IP rate limit exceeded
                  value:
                    error: "too_many_requests"
                    error_description: "Too many requests from this IP address. Please try again later."
                    retry_after: 900
                    correlation_id: "def456..."

        '503':
          description: Service unavailable (circuit breaker open)
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                circuit_open:
                  summary: External validation service unavailable
                  value:
                    error: "service_unavailable"
                    error_description: "Authentication service is temporarily unavailable. Please try again later."
                    correlation_id: "xyz789..."

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token using refresh token
      description: |
        Validates refresh token and issues new access + refresh token pair (token rotation).

        **Security**:
        - Old refresh token is immediately invalidated (marked as used)
        - Reuse detection: If used token is presented again, entire token family is invalidated
        - User must re-authenticate after token family invalidation

      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            examples:
              valid_request:
                summary: Valid refresh token request
                value:
                  refresh_token: "RToyMzQ1Njc4OTBhYmNkZWY="

      responses:
        '200':
          description: Token refreshed successfully
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
              examples:
                success:
                  summary: New token pair issued
                  value:
                    access_token: "eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9..."
                    refresh_token: "NEW_REFRESH_TOKEN_HERE"
                    token_type: "Bearer"
                    expires_in: 900

        '401':
          description: Invalid, expired, or revoked refresh token
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_token:
                  summary: Invalid refresh token
                  value:
                    error: "invalid_token"
                    error_description: "The provided refresh token is invalid"
                    correlation_id: "abc..."
                token_expired:
                  summary: Refresh token expired
                  value:
                    error: "invalid_token"
                    error_description: "The refresh token has expired"
                    correlation_id: "def..."
                token_revoked:
                  summary: Token manually revoked
                  value:
                    error: "token_revoked"
                    error_description: "The refresh token has been revoked"
                    correlation_id: "ghi..."
                family_invalidated:
                  summary: Token reuse detected
                  value:
                    error: "token_family_invalidated"
                    error_description: "Token reuse detected. All tokens in this session have been invalidated. Please re-authenticate."
                    correlation_id: "jkl..."

        '429':
          description: Rate limit exceeded
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/validate:
    post:
      tags:
        - Validation
      summary: Validate access token and retrieve user identity
      description: |
        Validates JWT access token signature, expiration, and revocation status.
        Returns complete user identity information on success.

        **Validation Checks**:
        - Signature verification (EdDSA/ES256)
        - Algorithm allowlist (rejects 'none' algorithm)
        - Expiration (exp claim)
        - Not before (nbf claim)
        - Issuer (iss claim)
        - Audience (aud claim)
        - Revocation status (in-memory cache + database fallback)

        **Performance**: <50ms p95 (local validation only)

      operationId: validateToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRequest'
            examples:
              valid_request:
                summary: Validate access token
                value:
                  access_token: "eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9..."

      responses:
        '200':
          description: Token is valid
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateResponse'
              examples:
                customer_valid:
                  summary: Valid customer token
                  value:
                    user_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    user_type: "customer"
                    username: "customer@example.com"
                    email: "customer@example.com"
                    roles: ["customer"]
                    permissions: ["view_orders", "create_order", "view_profile"]
                employee_valid:
                  summary: Valid employee token
                  value:
                    user_id: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                    user_type: "employee"
                    username: "employee@maliev.com"
                    email: "employee@maliev.com"
                    roles: ["employee", "admin"]
                    permissions: ["manage_orders", "manage_users", "view_analytics"]

        '401':
          description: Invalid, expired, or revoked token
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_token:
                  summary: Malformed or tampered token
                  value:
                    error: "invalid_token"
                    error_description: "The access token is invalid or malformed"
                    correlation_id: "abc..."
                token_expired:
                  summary: Token past expiration time
                  value:
                    error: "token_expired"
                    error_description: "The access token has expired"
                    correlation_id: "def..."
                token_revoked:
                  summary: Token has been revoked
                  value:
                    error: "token_revoked"
                    error_description: "The access token has been revoked"
                    correlation_id: "ghi..."
                algorithm_mismatch:
                  summary: Unexpected signing algorithm
                  value:
                    error: "invalid_token"
                    error_description: "Token algorithm is not allowed"
                    correlation_id: "jkl..."

  /auth/revoke:
    post:
      tags:
        - Revocation
      summary: Revoke active access token
      description: |
        Immediately revokes an access token before its natural expiration.
        Revocation is propagated to all services via Redis pub/sub (<2s).

        **Automatic Revocation Triggers**:
        - User logout
        - Password change
        - Account suspension
        - Administrator action
        - Token family invalidation (reuse detection)

      operationId: revokeToken
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRequest'
            examples:
              user_logout:
                summary: User initiated logout
                value:
                  access_token: "eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9..."
                  reason: "user_logout"
              password_changed:
                summary: Password changed
                value:
                  access_token: "eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9..."
                  reason: "password_changed"

      responses:
        '204':
          description: Token revoked successfully
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'

        '401':
          description: Invalid token
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/liveness:
    get:
      tags:
        - Health
      summary: Liveness probe
      description: |
        Kubernetes liveness probe endpoint. Returns 200 if service process is running.
        Does not check external dependencies.

      operationId: liveness
      responses:
        '200':
          description: Service is alive
          content:
            text/plain:
              schema:
                type: string
                example: "Healthy"

  /auth/readiness:
    get:
      tags:
        - Health
      summary: Readiness probe
      description: |
        Kubernetes readiness probe endpoint. Returns 200 if service is ready to accept traffic.
        Checks:
        - PostgreSQL database connectivity
        - External validation service circuit breaker status

      operationId: readiness
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
              examples:
                healthy:
                  summary: All checks passed
                  value:
                    status: "Healthy"
                    checks:
                      - name: "PostgreSQL"
                        status: "Healthy"
                        description: "Database connection successful"
                      - name: "CustomerValidationService"
                        status: "Healthy"
                        description: "Circuit breaker closed"
                      - name: "EmployeeValidationService"
                        status: "Healthy"
                        description: "Circuit breaker closed"

        '503':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
              examples:
                database_unhealthy:
                  summary: Database connection failed
                  value:
                    status: "Unhealthy"
                    checks:
                      - name: "PostgreSQL"
                        status: "Unhealthy"
                        description: "Connection timeout"
                        exception: "Npgsql.NpgsqlException: timeout"
                circuit_open:
                  summary: External service circuit open
                  value:
                    status: "Degraded"
                    checks:
                      - name: "PostgreSQL"
                        status: "Healthy"
                      - name: "CustomerValidationService"
                        status: "Unhealthy"
                        description: "Circuit breaker open"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token for authenticated requests.
        Format: `Authorization: Bearer <access_token>`

  headers:
    X-Correlation-ID:
      description: Correlation ID for distributed tracing
      schema:
        type: string
        format: uuid
        example: "4bf92f35-77b3-4da6-a3ce-929d0e0e4736"

    X-RateLimit-Limit:
      description: Maximum number of requests allowed in the current window
      schema:
        type: integer
        example: 5

    X-RateLimit-Remaining:
      description: Number of requests remaining in the current window
      schema:
        type: integer
        example: 3

    X-RateLimit-Reset:
      description: Unix timestamp when the rate limit window resets
      schema:
        type: integer
        format: int64
        example: 1696500000

    Retry-After:
      description: Number of seconds to wait before retrying
      schema:
        type: integer
        example: 900

  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
        - user_type
      properties:
        username:
          type: string
          description: User's username or email address
          example: "customer@example.com"
          minLength: 1
          maxLength: 255
        password:
          type: string
          description: User's password (validated by external service)
          example: "SecurePassword123!"
          format: password
          minLength: 1
          maxLength: 1000
        user_type:
          type: string
          enum: ["customer", "employee"]
          description: Type of user authentication
          example: "customer"

    LoginResponse:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          description: JWT access token (EdDSA/ES256 signed)
          example: "eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.abc123def456ghi789"
        refresh_token:
          type: string
          description: Opaque refresh token (base64 encoded, 256-bit random)
          example: "RToyMzQ1Njc4OTBhYmNkZWY="
        token_type:
          type: string
          enum: ["Bearer"]
          description: Token type (always "Bearer")
          example: "Bearer"
        expires_in:
          type: integer
          description: Access token lifetime in seconds (900 = 15 minutes)
          example: 900

    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: Previously issued refresh token
          example: "RToyMzQ1Njc4OTBhYmNkZWY="

    RefreshResponse:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          description: New JWT access token
          example: "eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9..."
        refresh_token:
          type: string
          description: New refresh token (old token is invalidated)
          example: "NEW_RToyMzQ1Njc4OTBhYmNkZWY="
        token_type:
          type: string
          enum: ["Bearer"]
          example: "Bearer"
        expires_in:
          type: integer
          description: Access token lifetime in seconds
          example: 900

    ValidateRequest:
      type: object
      required:
        - access_token
      properties:
        access_token:
          type: string
          description: JWT access token to validate
          example: "eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9..."

    ValidateResponse:
      type: object
      required:
        - user_id
        - user_type
        - username
        - email
        - roles
        - permissions
      properties:
        user_id:
          type: string
          format: uuid
          description: Unique user identifier
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        user_type:
          type: string
          enum: ["customer", "employee"]
          description: Type of authenticated user
          example: "customer"
        username:
          type: string
          description: User's username
          example: "customer@example.com"
        email:
          type: string
          format: email
          description: User's email address
          example: "customer@example.com"
        roles:
          type: array
          items:
            type: string
          description: User's assigned roles
          example: ["customer", "premium"]
        permissions:
          type: array
          items:
            type: string
          description: User's permissions
          example: ["view_orders", "create_order", "view_profile"]

    RevokeRequest:
      type: object
      required:
        - access_token
        - reason
      properties:
        access_token:
          type: string
          description: Access token to revoke
          example: "eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9..."
        reason:
          type: string
          enum:
            - "user_logout"
            - "password_changed"
            - "admin_action"
            - "suspicious_activity"
            - "token_family_invalidated"
          description: Reason for revocation (audit trail)
          example: "user_logout"

    ErrorResponse:
      type: object
      required:
        - error
        - error_description
        - correlation_id
      properties:
        error:
          type: string
          description: Machine-readable error code
          example: "invalid_credentials"
          enum:
            - "invalid_credentials"
            - "invalid_token"
            - "token_expired"
            - "token_revoked"
            - "token_family_invalidated"
            - "too_many_requests"
            - "service_unavailable"
        error_description:
          type: string
          description: Human-readable error description
          example: "The provided credentials are invalid"
        correlation_id:
          type: string
          format: uuid
          description: Correlation ID for troubleshooting
          example: "4bf92f35-77b3-4da6-a3ce-929d0e0e4736"
        retry_after:
          type: integer
          description: Seconds to wait before retrying (429 errors only)
          example: 900

    HealthCheckResponse:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum: ["Healthy", "Degraded", "Unhealthy"]
          description: Overall health status
          example: "Healthy"
        checks:
          type: array
          items:
            $ref: '#/components/schemas/HealthCheck'
          description: Individual health check results

    HealthCheck:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          description: Name of the health check
          example: "PostgreSQL"
        status:
          type: string
          enum: ["Healthy", "Degraded", "Unhealthy"]
          description: Health check status
          example: "Healthy"
        description:
          type: string
          description: Additional status information
          example: "Database connection successful"
        exception:
          type: string
          description: Exception details if unhealthy
          example: "Npgsql.NpgsqlException: timeout"

security: []
